name: openhands-native-ui

services:
  canvas:
    image: openhands-native-ui:1.14.0
    container_name: openhands-native-ui
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        AGENT_SERVER_IMAGE: ghcr.io/openhands/agent-server:1.42.1-python
        AGENT_SERVER_VERSION: 1.42.1
        AUTOMATION_VERSION: 1.7.1
        AGENT_CANVAS_VERSION: 1.14.0
        OPENHANDS_BUILD_GIT_SHA: ${NATIVE_UI_GIT_SHA:-unknown}
        OPENHANDS_BUILD_GIT_REF: codex/native-ui-1.14.0
        VITE_BASE_PATH: /canvas
        VITE_WORKING_DIR: /projects
        VITE_DO_NOT_TRACK: "1"
    ports:
      - "127.0.0.1:18800:8000"
    working_dir: /projects
    environment:
      VITE_DO_NOT_TRACK: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - state:/home/openhands/.openhands
      - projects:/projects
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all(['/health', '/api/automation/health', '/canvas/'].map(path => fetch('http://127.0.0.1:8000' + path).then(r => { if (!r.ok) throw new Error(String(r.status)); }))).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 4

volumes:
  state:
  projects:
